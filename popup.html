<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>らくらくにゅうりょくん！</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <p class="eyebrow">かんたんフォーム入力</p>
        <h1>らくらくにゅうりょくん！</h1>
        <p class="description">氏名を保存して、必要なページにだけ入力します。</p>
      </header>

      <section class="fields" aria-label="プロフィール">
        <label for="familyName">姓</label>
        <input id="familyName" name="familyName" type="text" autocomplete="family-name">

        <label for="givenName">名</label>
        <input id="givenName" name="givenName" type="text" autocomplete="given-name">

        <label for="familyNameLatin">英字姓</label>
        <input
          id="familyNameLatin"
          name="familyNameLatin"
          type="text"
          autocomplete="family-name"
          autocapitalize="characters"
          spellcheck="false"
        >

        <label for="givenNameLatin">英字名</label>
        <input
          id="givenNameLatin"
          name="givenNameLatin"
          type="text"
          autocomplete="given-name"
          autocapitalize="characters"
          spellcheck="false"
        >
      </section>

      <div class="actions">
        <button id="saveButton" class="button button-secondary" type="button">保存</button>
        <button id="fillButton" class="button button-primary" type="button">このページに入力</button>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
      <p class="privacy-note">入力や送信は、ボタンを押したときだけ行います。</p>
    </main>

    <script src="profile-storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
