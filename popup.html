<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>らくらくにゅうりょくん！</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <p class="eyebrow">かんたんフォーム入力</p>
        <h1>らくらくにゅうりょくん！</h1>
        <p class="description">プロフィールを保存して、必要なページにだけ入力します。</p>
      </header>

      <section class="fields" aria-label="プロフィール">
        <h2 class="section-heading">基本情報</h2>
        <label for="familyName">姓</label>
        <input id="familyName" name="familyName" type="text" autocomplete="family-name">

        <label for="givenName">名</label>
        <input id="givenName" name="givenName" type="text" autocomplete="given-name">

        <label for="familyNameLatin">英字姓</label>
        <input
          id="familyNameLatin"
          name="familyNameLatin"
          type="text"
          autocomplete="family-name"
          autocapitalize="characters"
          spellcheck="false"
        >

        <label for="givenNameLatin">英字名</label>
        <input
          id="givenNameLatin"
          name="givenNameLatin"
          type="text"
          autocomplete="given-name"
          autocapitalize="characters"
          spellcheck="false"
        >

        <label for="familyNameKana">セイ（カナ）</label>
        <input id="familyNameKana" name="familyNameKana" type="text" autocomplete="off">

        <label for="givenNameKana">メイ（カナ）</label>
        <input id="givenNameKana" name="givenNameKana" type="text" autocomplete="off">

        <label for="phoneNumber">電話番号</label>
        <input id="phoneNumber" name="phoneNumber" type="tel" autocomplete="tel">

        <label for="mobilePhone">携帯電話</label>
        <input id="mobilePhone" name="mobilePhone" type="tel" autocomplete="tel">

        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="email">

        <label for="birthDate">生年月日</label>
        <input id="birthDate" name="birthDate" type="date" autocomplete="bday">

        <label for="gender">性別</label>
        <select id="gender" name="gender">
          <option value="">未設定</option>
          <option value="男性">男性</option>
          <option value="女性">女性</option>
          <option value="その他">その他</option>
        </select>

        </select>

        <h2 class="section-heading">学校情報</h2>

        <label for="academicCourse">課程</label>
        <select id="academicCourse" name="academicCourse">
          <option value="">未設定</option>
          <option value="学部">学部</option>
          <option value="修士">修士</option>
          <option value="博士">博士</option>
          <option value="その他">その他</option>
        </select>

        <label for="grade">学年</label>
        <select id="grade" name="grade">
          <option value="">未設定</option>
          <option value="学部1年">学部1年</option>
          <option value="学部2年">学部2年</option>
          <option value="学部3年">学部3年</option>
          <option value="学部4年">学部4年</option>
          <option value="修士1年">修士1年</option>
          <option value="修士2年">修士2年</option>
          <option value="博士1年">博士1年</option>
          <option value="博士2年">博士2年</option>
          <option value="博士3年">博士3年</option>
          <option value="その他">その他</option>
        </select>

        <label for="schoolName">学校名</label>
        <input id="schoolName" name="schoolName" type="text" autocomplete="organization">

        <label for="departmentName">研究科</label>
        <input id="departmentName" name="departmentName" type="text">

        <label for="majorName">専攻・コース</label>
        <input id="majorName" name="majorName" type="text">

        <label for="enrollmentMonth">入学年月</label>
        <input id="enrollmentMonth" name="enrollmentMonth" type="month">

        <label for="graduationMonth">卒業予定年月</label>
        <input id="graduationMonth" name="graduationMonth" type="month">

        <h2 class="section-heading">研究情報</h2>

        <label for="laboratoryName">所属研究室</label>
        <input id="laboratoryName" name="laboratoryName" type="text">

        <label for="laboratoryStartMonth">所属開始年月</label>
        <input id="laboratoryStartMonth" name="laboratoryStartMonth" type="month">

        <label for="laboratoryEndMonth">所属終了予定年月</label>
        <input id="laboratoryEndMonth" name="laboratoryEndMonth" type="month">

        <label for="researchKeywords">研究キーワード</label>
        <textarea id="researchKeywords" name="researchKeywords" rows="3" placeholder="1行に1つ入力"></textarea>

        <label for="researchOverview">研究概要</label>
        <textarea id="researchOverview" name="researchOverview" rows="4"></textarea>
      </section>

      <div class="actions">
        <button id="saveButton" class="button button-secondary" type="button">保存</button>
        <button id="fillButton" class="button button-primary" type="button">このページに入力</button>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
      <p class="privacy-note">入力や送信は、ボタンを押したときだけ行います。</p>
    </main>

    <script src="profile-storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
