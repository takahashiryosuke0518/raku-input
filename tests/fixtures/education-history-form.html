<!doctype html>
<html lang="ja">
  <body>
    <form>
      <div>
        <div class="heading_l2">中学校</div>
        <dl><dt>◆学校名 <font>（全半角50文字以内）</font><br></dt><dd><input type="text"></dd></dl>
        <dl><dt>◆入学／卒業年月<br></dt><dd><span class="jqTransformSelectWrapper"><select><option value="">年</option><option value="2020">2020年</option></select></span><label>年</label><span class="jqTransformSelectWrapper"><select><option value="">月</option><option value="4">4月</option></select></span><label>月</label><span class="jqTransformSelectWrapper"><select><option value="">年</option><option value="2023">2023年</option></select></span><label>年</label><span class="jqTransformSelectWrapper"><select><option value="">月</option><option value="3">3月</option></select></span><label>月</label></dd></dl>

        <div class="heading_l2">高等学校（中等教育学校）</div>
        <dl><dt>◆学校名 <font>（全半角50文字以内）</font><br></dt><dd><input type="text"></dd></dl>
        <dl><dt>◆入学／卒業年月<br></dt><dd><span class="jqTransformSelectWrapper"><select><option value="">年</option><option value="2023">2023年</option></select></span><label>年</label><span class="jqTransformSelectWrapper"><select><option value="">月</option><option value="4">4月</option></select></span><label>月</label><span class="jqTransformSelectWrapper"><select><option value="">年</option><option value="2026">2026年</option></select></span><label>年</label><span class="jqTransformSelectWrapper"><select><option value="">月</option><option value="3">3月</option></select></span><label>月</label></dd></dl>

        <div class="heading_l2">出身大学（学士）</div>
        <div class="education-note">最終学歴が修士または博士の場合に回答してください。</div>
        <dl><dt>大学学校名 <font>（全半角50文字以内）</font><br></dt><dd><input type="text"></dd></dl>
        <dl><dt>大学学部名 <font>（全半角50文字以内）</font><br></dt><dd><input type="text"></dd></dl>
        <dl><dt>大学学科名 <font>（全半角50文字以内）</font><br></dt><dd><input type="text"></dd></dl>
        <dl><dt>入学／卒業年月<br></dt><dd><span class="jqTransformSelectWrapper"><select><option value="">年</option><option value="2026">2026年</option></select></span><label>年</label><span class="jqTransformSelectWrapper"><select><option value="">月</option><option value="4">4月</option></select></span><label>月</label><span class="jqTransformSelectWrapper"><select><option value="">年</option><option value="2030">2030年</option></select></span><label>年</label><span class="jqTransformSelectWrapper"><select><option value="">月</option><option value="3">3月</option></select></span><label>月</label></dd></dl>

        <div class="heading_l2">出身大学（修士）</div>
        <div class="education-note">最終学歴が博士の場合に回答してください。</div>
        <dl><dt>大学院学校名</dt><dd><input type="text"></dd></dl>
        <dl><dt>研究科名</dt><dd><input type="text"></dd></dl>
        <dl><dt>専攻名</dt><dd><input type="text"></dd></dl>
        <dl><dt>入学年月</dt><dd><span class="jqTransformSelectWrapper"><select><option value="2030">2030年</option></select></span><label>年</label><span class="jqTransformSelectWrapper"><select><option value="4">4月</option></select></span><label>月</label></dd></dl>
        <dl><dt>修了年月</dt><dd><span class="jqTransformSelectWrapper"><select><option value="2032">2032年</option></select></span><label>年</label><span class="jqTransformSelectWrapper"><select><option value="3">3月</option></select></span><label>月</label></dd></dl>

        <div class="heading_l2">最終学歴情報をご確認の上、間違いがある場合は修正してください。</div>
        <dl><dt>学歴区分</dt><dd><select><option value="">未設定</option><option value="bachelor">大学（学士）</option><option value="master">大学院（修士）</option><option value="doctorate">大学院（博士）</option></select></dd></dl>
        <dl><dt>◆入学年月</dt><dd><span class="jqTransformSelectWrapper"><select><option value="">年</option><option value="2022">2022年</option></select></span><label>年</label><span class="jqTransformSelectWrapper"><select><option value="">月</option><option value="4">4月</option></select></span><label>月</label></dd></dl>
        <dl><dt>◆卒業年月</dt><dd><span class="jqTransformSelectWrapper"><select><option value="">年</option><option value="2024">2024年</option></select></span><label>年</label><span class="jqTransformSelectWrapper"><select><option value="">月</option><option value="3">3月</option></select></span><label>月</label><span class="jqTransformSelectWrapper"><select><option value="">未設定</option><option value="completed">修了</option><option value="completionExpected">修了見込み</option></select></span></dd></dl>

        <div>その他学歴</div>
        <dl><dt>学校名</dt><dd><input type="text"></dd></dl>
        <div>高等専門学校</div>
        <dl><dt>学校名</dt><dd><input type="text"></dd></dl>
      </div>
    </form>
  </body>
</html>
