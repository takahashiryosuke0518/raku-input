<!doctype html>
<html lang="ja">
  <body>
    <form>
      <section aria-labelledby="current-address-heading">

          <input name="gyubin1" type="text">-

          <input name="kttel1" type="text">-<input name="kttel2" type="text">-<input name="kttel3" type="text">

      </section>
      <section>

        <input id="vacation-address" type="text">
      </section>

</html>
